name: Review IA

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Review com IA (SDD/TDD/Swagger)
        uses: coderabbitai/ai-pr-reviewer@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.GROQ_API_KEY }}
        with:
          debug: false
          review_simple_changes: false
          review_comment_lgtm: false

      - name: Fallback - status check
        if: failure()
        run: echo "Review IA falhou, mas não bloqueia merge — veja logs"
