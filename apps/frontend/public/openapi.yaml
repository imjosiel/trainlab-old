  # PLANOS DE TREINO
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  /api/training-plans:
    get:
      tags: [Planos de Treino]
      summary: Listar planos de treino
      description: |
        Trainer vê os planos que criou.
        Atleta/Aluno vê os próprios planos.
        Admin pode filtrar por trainer.
      operationId: getTrainingPlans
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TrainingPlanStatus'
        - name: studentId
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Lista de planos paginada
          content:
            application/json:
              schema:
                type: object
                properties:
                  plans:
                    type: array
                    items:
                      $ref: '#/components/schemas/TrainingPlanSummary'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [Planos de Treino]
      summary: Criar plano de treino com IA
      description: |
        Cria um novo plano de treino usando IA (Groq/Gemini/Ollama).
        O plano é gerado em 2 fases para otimizar qualidade.
        Consome créditos do trainer.
        Requer role TRAINER.
      operationId: createTrainingPlan
      security:
        - BearerAuth: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentId, daysPerWeek]
              properties:
                studentId:
                  type: string
                  description: ID do aluno (Student model)
                title:
                  type: string
                  maxLength: 150
                daysPerWeek:
                  type: integer
                  minimum: 1
                  maximum: 7
                  example: 3
                durationWeeks:
                  type: integer
                  minimum: 1
                  maximum: 52
                  example: 4
                objective:
                  type: string
                  example: "Aumentar velocidade em sprints de 10m"
                notes:
                  type: string
                  description: Notas adicionais para o prompt de IA
                useAI:
                  type: boolean
                  default: true
                  description: Se false, cria plano vazio sem IA
      responses:
        '201':
          description: Plano criado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan:
                    $ref: '#/components/schemas/TrainingPlanSummary'
        '400':
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Proibido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit atingido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

