  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  /api/appointments:
    get:
      tags: [Agendamentos]
      summary: Listar agendamentos
      description: |
        Trainer e Admin veem todos os seus agendamentos.
        Atleta/Aluno vê apenas os próprios.
      operationId: getAppointments
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AppointmentStatus'
        - name: from
          in: query
          description: Data de início (ISO 8601)
          schema:
            type: string
            format: date-time
            example: "2026-04-01T00:00:00.000Z"
        - name: to
          in: query
          description: Data de fim (ISO 8601)
          schema:
            type: string
            format: date-time
            example: "2026-04-30T23:59:59.000Z"
        - name: trainerId
          in: query
          description: Filtrar por trainer (apenas ADMIN)
          schema:
            type: string
      responses:
        '200':
          description: Lista de agendamentos
          content:
            application/json:
              schema:
                type: object
                properties:
                  appointments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Appointment'
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [Agendamentos]
      summary: Criar agendamento
      description: Cria um agendamento entre trainer e atleta/aluno. Envia notificação ao atleta.
      operationId: createAppointment
      security:
        - BearerAuth: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, scheduledAt]
              properties:
                title:
                  type: string
                  maxLength: 150
                  example: "Treino de sprints"
                scheduledAt:
                  type: string
                  format: date-time
                  example: "2026-04-01T10:00:00.000Z"
                durationMinutes:
                  type: integer
                  default: 60
                  example: 90
                location:
                  type: string
                  nullable: true
                  example: "Campo Municipal"
                description:
                  type: string
                  nullable: true
                trainerNotes:
                  type: string
                  nullable: true
                studentId:
                  type: string
                  description: ID do Student (StudentRecord). Obrigatório se athleteId não informado.
                athleteId:
                  type: string
                  description: ID do User atleta. Obrigatório se studentId não informado.
                trainingPlanId:
                  type: string
                  nullable: true
      responses:
        '201':
          description: Agendamento criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  appointment:
                    $ref: '#/components/schemas/Appointment'
        '400':
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Proibido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

