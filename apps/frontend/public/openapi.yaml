  /api/exercises/{id}:
    get:
      tags: [Exercícios]
      summary: Buscar exercício por ID
      operationId: getExerciseById
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Dados do exercício
          content:
            application/json:
              schema:
                type: object
                properties:
                  exercise:
                    $ref: '#/components/schemas/Exercise'
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # AFILIADOS
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  /api/affiliate/earnings:
    get:
      tags: [Afiliados]
      summary: Listar ganhos do afiliado (paginado)
      description: |
        Retorna o histórico de comissões do afiliado autenticado com paginação e filtro por data.
        Máximo de 50 itens por página. Rate limit: 20 req/min.
      operationId: getAffiliateEarnings
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: page
          in: query
          description: Número da página (>= 1)
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          description: Itens por página (1-50)
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 50
        - name: startDate
          in: query
          description: Data inicial (ISO 8601)
          schema:
            type: string
            format: date
            example: "2026-01-01"
        - name: endDate
          in: query
          description: Data final (ISO 8601, deve ser >= startDate)
          schema:
            type: string
            format: date
            example: "2026-12-31"
      responses:
        '200':
          description: Lista paginada de ganhos
          content:
            application/json:
              schema:
                type: object
                required: [earnings, total, page, limit, totalPages]
                properties:
                  earnings:
                    type: array
                    items:
                      $ref: '#/components/schemas/AffiliateEarning'
                  total:
                    type: integer
                    description: Total de registros
                    example: 42
                  page:
                    type: integer
                    example: 1
                  limit:
                    type: integer
                    example: 20
                  totalPages:
                    type: integer
                    example: 3
        '400':
          description: Parâmetros inválidos (ex. endDate < startDate)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Acesso restrito a afiliados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/affiliate/report:
    get:
      tags: [Afiliados]
      summary: Relatório detalhado do afiliado
      description: |
        Retorna breakdown por parceiro indicado com contagem de alunos,
        ganhos mensais, e projeção de MRR. Rate limit: 10 req/min.
      operationId: getAffiliateReport
      security:
        - BearerAuth: []
        - CookieAuth: []
      responses:
        '200':
          description: Relatório completo
          content:
            application/json:
              schema:
                type: object
                properties:
                  partners:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        image:
                          type: string
                          nullable: true
                        tier:
                          type: string
                        status:
                          type: string
                        activeStudentsCount:
                          type: integer
                        totalEarned:
                          type: integer
                          description: Em centavos
                        earnedThisMonth:
                          type: integer
                        lastEarningDate:
                          type: string
                          format: date-time
                          nullable: true
                        earningsByMonth:
                          type: array
                          items:
                            type: object
                            properties:
                              month:
                                type: string
                                example: "2026-07"
                              total:
                                type: integer
                  projection:
                    type: object
                    properties:
                      currentMonthTotal:
                        type: integer
                      lastMonthTotal:
                        type: integer
                      estimatedMrr:
                        type: integer
                      trend:
                        type: string
                        enum: [up, down, stable]
                      earningsByMonth:
                        type: array
                        items:
                          type: object
                          properties:
                            month:
                              type: string
                            total:
                              type: integer
                            label:
                              type: string
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Acesso restrito a afiliados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/affiliate/connect/setup:
    post:
      tags: [Afiliados]
      summary: Configurar conta Stripe Connect do afiliado
      description: |
        Cria uma Connected Account no Stripe para o afiliado autenticado.
        Se já existir uma conta Stripe associada, retorna o ID existente.
        Busca contas Stripe existentes por metadata antes de criar uma nova.
        Requer role AFFILIATE ou ADMIN.
      operationId: affiliateConnectSetup
      security:
        - BearerAuth: []
        - CookieAuth: []
      responses:
        '200':
          description: Conta Stripe Connect configurada (existente ou nova)
          content:
            application/json:
              schema:
                type: object
                required: [stripeAccountId]
                properties:
                  stripeAccountId:
                    type: string
                    description: ID da Connected Account no Stripe
                    example: "acct_1abc123def456"
        '401':
          description: Não autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Não autorizado"
        '403':
          description: Acesso restrito a afiliados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Acesso restrito a afiliados."
        '404':
          description: Conta de afiliado não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Conta de afiliado não encontrada."
        '500':
          description: Erro interno ao criar conta Stripe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Erro ao criar conta Stripe Connect. Tente novamente."

  /api/affiliate/connect/session:
    post:
      tags: [Afiliados]
      summary: Criar sessão Stripe Connect para embed de UI
      description: |
        Cria uma Account Session no Stripe para renderizar componentes embarcados
        (account_onboarding, account_management, payouts) no frontend.
        A conta Stripe Connect deve ter sido configurada previamente via `/api/affiliate/connect/setup`.
      operationId: affiliateConnectSession
      security:
        - BearerAuth: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                components:
                  type: array
                  description: Componentes Stripe Connect a habilitar na sessão
                  items:
                    type: string
                    enum: [account_onboarding, account_management, payouts]
                  default: [account_onboarding]
                  example: [account_onboarding]
      responses:
        '200':
          description: Sessão criada com sucesso
          content:
            application/json:
              schema:
                type: object
                required: [clientSecret]
                properties:
                  clientSecret:
                    type: string
                    description: Client secret para inicializar o Stripe Connect embed
                    example: "seti_1abc...secret_xyz"
        '400':
          description: Conta Stripe não configurada ou componentes inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_configured:
                  value:
                    error: "Conta Stripe Connect não configurada. Complete o setup primeiro."
                invalid_components:
                  value:
                    error: "Nenhum componente válido especificado. Use: account_onboarding, account_management, payouts."
        '401':
          description: Não autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erro interno ao criar sessão
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Falha ao iniciar sessão bancária. Tente novamente."

  /api/affiliate/connect/sync:
    post:
      tags: [Afiliados]
      summary: Sincronizar status do Stripe Connect com o banco
      description: |
        Consulta o status real da conta Stripe Connect e atualiza o banco de dados local.
        Verifica payouts_enabled, charges_enabled e requirements.disabled_reason
        para determinar se o status é 'active', 'pending' ou 'restricted'.

        Quando payoutsEnabled muda de false→true e há earnings pendentes,
        executa flush automático: transfere cada earning via Stripe e
        atualiza status de 'pending' para 'available'.
      operationId: affiliateConnectSync
      security:
        - BearerAuth: []
        - CookieAuth: []
      responses:
        '200':
          description: Status sincronizado com sucesso
          content:
            application/json:
              schema:
                type: object
                required: [payoutsEnabled, chargesEnabled, stripeAccountStatus]
                properties:
                  payoutsEnabled:
                    type: boolean
                    description: Se a conta Stripe pode receber payouts
                    example: true
                  chargesEnabled:
                    type: boolean
                    description: Se a conta Stripe pode processar cobranças
                    example: true
                  stripeAccountStatus:
                    type: string
                    enum: [pending, active, restricted]
                    description: Status calculado da conta Stripe
                    example: "active"
                  flushedEarnings:
                    type: integer
                    description: Número de earnings pendentes que foram transferidos automaticamente (presente apenas quando houve flush)
                    example: 3
        '400':
          description: Conta Stripe Connect não configurada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Conta Stripe Connect não configurada."
        '401':
          description: Não autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erro ao sincronizar com Stripe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Erro ao sincronizar status do Stripe."

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # PARTNER
