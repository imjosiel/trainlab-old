openapi: 3.1.0

info:
  title: Player.Action API
  description: |
    API REST da plataforma **Player.Action** — Personal Training Platform for Sports Coaches.

    ## Autenticação

    A API suporta dois métodos de autenticação:
    - **Cookie de Sessão** (browser): token `next-auth.session-token` gerenciado pelo NextAuth
    - **Bearer Token** (integrações externas): `Authorization: Bearer <token>` — token JWT gerado via NextAuth

    ## Roles e Permissões

    | Role | Acesso |
    |------|--------|
    | `TRAINER` | Criar/gerenciar alunos, planos, agendamentos |
    | `ATHLETE` | Ver próprios planos e agendamentos |
    | `PARTNER` | Endpoints `/api/partner/*` |
    | `AFFILIATE` | Endpoints `/api/affiliate/*` — programa de afiliados |
    | `ADMIN` | Todos os endpoints + `/api/admin/*` |

  version: "1.0.0"
  contact:
    name: Player.Action
    url: https://playeraction.com.br

servers:
  - url: http://localhost:3001
    description: Desenvolvimento Local
  - url: https://playeraction.hidrasistemas.com.br
    description: Produção

tags:
  - name: Público
    description: Endpoints sem autenticação
  - name: Dashboard
    description: Estatísticas e visão geral do trainer
  - name: Alunos
    description: CRUD de alunos (requer TRAINER)
  - name: Planos de Treino
    description: Criação e gestão de planos de treino com IA
  - name: Agendamentos
    description: Agendamento de sessões entre trainer e atleta
  - name: Notificações
    description: Notificações do usuário autenticado
  - name: Créditos
    description: Saldo e histórico de créditos
  - name: Exercícios
    description: Biblioteca de exercícios
  - name: Conversas
    description: Mensagens entre trainer e atleta
  - name: Perfil
    description: Dados do usuário autenticado
  - name: Partner
    description: Endpoints do programa de parceiros (requer PARTNER)
  - name: Afiliados
    description: Programa de afiliados — Stripe Connect, sessões e sincronização (requer AFFILIATE)
  - name: Admin
    description: Endpoints administrativos (requer ADMIN)

# ─── Security Schemes ─────────────────────────────────────────────────────────
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT gerado via NextAuth (`next-auth/jwt encode`)
    CookieAuth:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: Cookie de sessão gerenciado pelo browser (NextAuth)

  # ─── Shared Schemas ───────────────────────────────────────────────────────
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          example: "Unauthorized"

    Pagination:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        totalPages:
          type: integer

    # ── Usuário / Perfil ──────────────────────────────────────────────────
    UserSummary:
      type: object
      properties:
        id:
          type: string
          example: "cuid_abc123"
        name:
          type: string
          example: "João Silva"
        email:
          type: string
          format: email
          example: "joao@example.com"
        image:
          type: string
          nullable: true
          example: "https://res.cloudinary.com/..."

    # ── Partner Tier ──────────────────────────────────────────────────────
    PartnerTier:
      type: object
      properties:
        id:
          type: string
          example: "cmn4m3604000el6lb..."
        slug:
          type: string
          example: "starter"
        name:
          type: string
          example: "Starter"
        description:
          type: string
          nullable: true
          example: "Plano base para treinadores parceiros iniciantes."
        price:
          type: number
          format: float
          example: 0
        commissionRate:
          type: number
          format: float
          example: 0.6
          description: Taxa de comissão (0.0 a 1.0)
        minPrice:
          type: number
          format: float
          example: 99.9
        maxAthletes:
          type: integer
          nullable: true
          example: null
        maxPlansPerMonth:
          type: integer
          nullable: true
          example: 10
        allowFlexibleDistribution:
          type: boolean
          example: true
        allowHourlyRate:
          type: boolean
          example: false
        creditsPerPeriod:
          type: integer
          nullable: true
          example: null
        creditResetPeriod:
          type: string
          enum: [monthly, quarterly, yearly]
          example: "monthly"

    # ── Aluno / Student ───────────────────────────────────────────────────
    AthleteProfile:
      type: object
      properties:
        id:
          type: string
        sportId:
          type: string
        sportName:
          type: string
        position:
          type: string
        technicalLevel:
          type: string
          nullable: true
        yearsPlaying:
          type: integer
          nullable: true

    StudentPlanCounts:
      type: object
      properties:
        total:
          type: integer
        active:
          type: integer
        completed:
          type: integer
        pending:
          type: integer

    Student:
      type: object
      properties:
        id:
          type: string
          example: "cuid_student123"
        name:
          type: string
          example: "Carlos Mendes"
        email:
          type: string
          format: email
          nullable: true
          example: "carlos@example.com"
        userId:
          type: string
          nullable: true
        image:
          type: string
          nullable: true
        profile:
          $ref: '#/components/schemas/AthleteProfile'
          nullable: true
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/AthleteProfile'
        since:
          type: string
          format: date-time
        planCounts:
          $ref: '#/components/schemas/StudentPlanCounts'

    # ── Plano de Treino ───────────────────────────────────────────────────
    TrainingPlanStatus:
      type: string
      enum: [DRAFT, PENDING, APPROVED, DELIVERED, COMPLETED, CANCELLED]

    TrainingPlanSummary:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        status:
          $ref: '#/components/schemas/TrainingPlanStatus'
        studentId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TrainingPlanSettings:
      type: object
      description: Configurações do plano ativo do atleta
      properties:
        allowAutoComplete:
          type: boolean
        showDayNumbers:
          type: boolean

    # ── Agendamento / Appointment ─────────────────────────────────────────
    AppointmentStatus:
      type: string
      enum: [PENDING, CONFIRMED, COMPLETED, CANCELLED, NO_SHOW]

    Appointment:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
          example: "Treino de velocidade"
        description:
          type: string
          nullable: true
        scheduledAt:
          type: string
          format: date-time
          example: "2026-04-01T10:00:00.000Z"
        durationMinutes:
          type: integer
          example: 60
        location:
          type: string
          nullable: true
          example: "Campo Municipal"
        trainerNotes:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/AppointmentStatus'
        trainerId:
          type: string
        studentId:
          type: string
          nullable: true
        athleteId:
          type: string
          nullable: true
        trainingPlanId:
          type: string
          nullable: true
        student:
          nullable: true
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            email:
              type: string
              nullable: true
            user:
              $ref: '#/components/schemas/UserSummary'
              nullable: true
        athlete:
          $ref: '#/components/schemas/UserSummary'
          nullable: true
        trainer:
          $ref: '#/components/schemas/UserSummary'
          nullable: true
        trainingPlan:
          nullable: true
          type: object
          properties:
            id:
              type: string
            title:
              type: string
            status:
              $ref: '#/components/schemas/TrainingPlanStatus'

    # ── Notificação ───────────────────────────────────────────────────────
    Notification:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [SYSTEM, STUDENT_INVITE, PLAN_READY, APPOINTMENT, PAYMENT]
        title:
          type: string
          example: "Novo agendamento! 📅"
        message:
          type: string
        isRead:
          type: boolean
        link:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    # ── Dashboard Stats ───────────────────────────────────────────────────
    DashboardStats:
      type: object
      properties:
        total:
          type: integer
          example: 42
        pending:
          type: integer
          example: 5
        approved:
          type: integer
          example: 10
        completed:
          type: integer
          example: 25
        cancelled:
          type: integer
          example: 2
        plansByDay:
          type: array
          description: Últimos 30 dias de atividade
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              count:
                type: integer
        plansByStatus:
          type: object
          properties:
            DRAFT:
              type: integer
            PENDING:
              type: integer
            APPROVED:
              type: integer
            DELIVERED:
              type: integer
            COMPLETED:
              type: integer
            CANCELLED:
              type: integer

    # ── Exercício ─────────────────────────────────────────────────────────
    Exercise:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          example: "Sprints 10m"
        description:
          type: string
          nullable: true
        videoUrl:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        difficulty:
          type: string
          nullable: true
        sport:
          type: object
          nullable: true
          properties:
            id:
              type: string
            name:
              type: string

    # ── Módulos (Feature Flags públicas) ─────────────────────────────────
    ModuleFlags:
      type: object
      description: Flags de módulos habilitados na plataforma
      properties:
        moduleAthleteEnabled:
          type: boolean
          description: Módulo de atleta independente habilitado
          example: false
        moduleCoachEnabled:
          type: boolean
          description: Módulo de treinador SaaS habilitado
          example: false
        modulePartnerB2BEnabled:
          type: boolean
          description: Módulo de parceiro B2B habilitado
          example: true
        moduleAffiliateEnabled:
          type: boolean
          description: Módulo de afiliados habilitado
          example: true

    # ── Conta de Afiliado ────────────────────────────────────────────────
    AffiliateAccount:
      type: object
      description: Conta do programa de afiliados vinculada a um usuário
      properties:
        id:
          type: string
          example: "cuid_aff123"
        userId:
          type: string
          example: "cuid_user456"
        referralCode:
          type: string
          description: Código único de indicação do afiliado
          example: "afiliado-josiel"
        pendingBalance:
          type: integer
          description: Saldo pendente em centavos (aguardando carência)
          example: 15000
        availableBalance:
          type: integer
          description: Saldo disponível para saque em centavos
          example: 50000
        status:
          type: string
          enum: [approved, suspended]
          description: Status da conta de afiliado
          example: "approved"
        customCommissionRate:
          type: number
          format: float
          nullable: true
          description: Taxa de comissão personalizada (override do tier)
          example: 0.02
        stripeAccountId:
          type: string
          nullable: true
          description: ID da conta Stripe Connect do afiliado
          example: "acct_1abc123"
        stripeAccountStatus:
          type: string
          enum: [not_started, pending, active, restricted]
          description: Status da conta Stripe Connect
          example: "active"
        payoutsEnabled:
          type: boolean
          description: Se a conta Stripe pode receber pagamentos
          example: true
        chargesEnabled:
          type: boolean
          description: Se a conta Stripe pode processar cobranças
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ── Ganhos do Afiliado ───────────────────────────────────────────────
    AffiliateEarning:
      type: object
      description: Registro de comissão gerada por uma assinatura indicada pelo afiliado
      properties:
        id:
          type: string
          example: "cuid_earn789"
        affiliateId:
          type: string
          description: ID da AffiliateAccount
        partnerId:
          type: string
          description: ID da PartnerAccount que gerou o ganho
        grossAmount:
          type: integer
          description: Total pago pelo aluno em centavos (price + hourlyRate)
          example: 19900
        baseAmount:
          type: integer
          description: Valor base da oferta em centavos (sobre o qual a comissão incide)
          example: 14900
        earnedAmount:
          type: integer
          description: Comissão calculada em centavos
          example: 149
        commissionRate:
          type: number
          format: float
          description: Taxa de comissão aplicada no momento do cálculo
          example: 0.01
        status:
          type: string
          enum: [pending, available, paid, cancelled]
          description: Status do ganho
          example: "pending"
        subscriptionId:
          type: string
          nullable: true
          description: ID da assinatura Stripe de origem
        invoiceId:
          type: string
          nullable: true
          description: ID da invoice Stripe (idempotência)
        createdAt:
          type: string
          format: date-time
        paidAt:
          type: string
          format: date-time
          nullable: true

    # ── Configurações do Sistema (Admin) ─────────────────────────────────
    SystemSettings:
      type: object
      description: Configurações globais da plataforma (feature flags, regras de negócio, IA)
      properties:
        id:
          type: string
        moduleAthleteEnabled:
          type: boolean
          example: false
        moduleCoachEnabled:
          type: boolean
          example: false
        modulePartnerB2BEnabled:
          type: boolean
          example: true
        moduleAffiliateEnabled:
          type: boolean
          example: true
        autoApprovePartners:
          type: boolean
          description: Aprovar parceiros automaticamente ao se candidatar
          example: true
        autoApproveTierChange:
          type: boolean
          description: Aprovar mudanças de tier automaticamente
          example: true
        defaultCommissionRate:
          type: number
          format: float
          description: Taxa de comissão padrão (0.0 a 1.0)
          example: 0.15
        allowMultipleTrainersPerSport:
          type: boolean
          example: false
        enableVideoHoverPreview:
          type: boolean
          example: true
        videoHoverType:
          type: string
          enum: [TEASER, FULL, THUMBNAIL]
          example: "TEASER"
        enableB2BTestMode:
          type: boolean
          example: false
        storageProvider:
          type: string
          enum: [r2, cloudinary]
          example: "r2"
        aiProvider:
          type: string
          enum: [groq, gemini]
          example: "groq"
        geminiModel:
          type: string
          example: "gemini-2.0-flash"
        enableCreditSystem:
          type: boolean
          example: false
        creditCostPlanGen:
          type: integer
          description: Custo em créditos para gerar um plano via IA
          example: 10
        creditCostAiVideo:
          type: integer
          description: Custo em créditos para gerar vídeo via IA
          example: 50
        uiTheme:
          type: string
          enum: [light, dark-blue]
          example: "light"
        updatedAt:
          type: string
          format: date-time

# ─── Paths ────────────────────────────────────────────────────────────────────
paths:

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # PÚBLICO
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  /api/public/partner-tiers:
    get:
      tags: [Público]
      summary: Listar tiers de parceiros disponíveis
      description: Retorna todos os tiers do programa de parceiros. Não requer autenticação.
      operationId: getPublicPartnerTiers
      responses:
        '200':
          description: Lista de tiers
          content:
            application/json:
              schema:
                type: object
                properties:
                  tiers:
                    type: array
                    items:
                      $ref: '#/components/schemas/PartnerTier'
              example:
                tiers:
                  - id: "cmn4m3604000el6lb..."
                    slug: "starter"
                    name: "Starter"
                    price: 0
                    commissionRate: 0.6
                    minPrice: 99.9
                    maxAthletes: null
                    maxPlansPerMonth: 10
                    allowFlexibleDistribution: true
                    allowHourlyRate: false

  /api/public/modules:
    get:
      tags: [Público]
      summary: Retornar módulos habilitados
      description: Retorna quais módulos (Athlete, Coach, Partner, Affiliate) estão ativos no momento.
      operationId: getPublicModules
      responses:
        '200':
          description: Módulos ativos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleFlags'

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # DASHBOARD
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  /api/dashboard/stats:
    get:
      tags: [Dashboard]
      summary: Estatísticas do trainer
      description: Retorna métricas de planos criados, status distribution e atividade dos últimos 30 dias.
      operationId: getDashboardStats
      security:
        - BearerAuth: []
        - CookieAuth: []
      responses:
        '200':
          description: Estatísticas do dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStats'
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # ALUNOS
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  /api/students:
    get:
      tags: [Alunos]
      summary: Listar alunos do trainer
      description: |
        Retorna todos os alunos do trainer autenticado.
        Admin pode ver alunos de outro trainer via `?trainerId=`.
      operationId: getStudents
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: q
          in: query
          description: Busca por nome (ILIKE)
          schema:
            type: string
            maxLength: 100
        - name: search
          in: query
          description: Alias de `q` (legado)
          schema:
            type: string
        - name: trainerId
          in: query
          description: Filtrar por trainer (apenas ADMIN)
          schema:
            type: string
      responses:
        '200':
          description: Lista de alunos
          content:
            application/json:
              schema:
                type: object
                properties:
                  students:
                    type: array
                    items:
                      $ref: '#/components/schemas/Student'
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sem permissão (não é TRAINER)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [Alunos]
      summary: Criar aluno
      description: |
        Cria um novo aluno para o trainer autenticado.
        Se o email já tiver conta, vincula automaticamente.
        Envia email de convite ao atleta (fire-and-forget).
        Requer role TRAINER.
      operationId: createStudent
      security:
        - BearerAuth: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 100
                  example: "Carlos Mendes"
                email:
                  type: string
                  format: email
                  example: "carlos@example.com"
                sportId:
                  type: string
                  description: ID do esporte (prioritário sobre slug)
                sport:
                  type: string
                  description: Slug do esporte (fallback)
                  example: "football"
                position:
                  type: string
                  maxLength: 50
                  example: "Atacante"
      responses:
        '200':
          description: Aluno criado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Aluno adicionado com sucesso"
                  student:
                    $ref: '#/components/schemas/Student'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sem permissão ou limite de atletas atingido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/students/{id}:
    get:
      tags: [Alunos]
      summary: Buscar aluno por ID
      operationId: getStudentById
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Dados do aluno
          content:
            application/json:
              schema:
                type: object
                properties:
                  student:
                    $ref: '#/components/schemas/Student'
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags: [Alunos]
      summary: Atualizar dados do aluno
      operationId: updateStudent
      security:
        - BearerAuth: []
