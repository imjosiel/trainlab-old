  /api/admin/overview:
    get:
      tags: [Admin]
      summary: Visão geral da plataforma (ADMIN)
      operationId: adminGetOverview
      security:
        - BearerAuth: []
        - CookieAuth: []
      responses:
        '200':
          description: Métricas gerais da plataforma
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalUsers:
                    type: integer
                  totalTrainers:
                    type: integer
                  totalStudents:
                    type: integer
                  totalPlans:
                    type: integer
                  totalPartners:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/settings:
    get:
      tags: [Admin]
      summary: Retornar configurações da plataforma
      description: |
        Retorna todas as configurações do sistema (feature flags, regras de negócio, IA, créditos, UI).
        Requer autenticação — qualquer usuário logado pode ler.
        Resposta cacheada por 30 segundos com stale-while-revalidate de 60s.
      operationId: adminGetSettings
      security:
        - BearerAuth: []
        - CookieAuth: []
      responses:
        '200':
          description: Configurações completas do sistema
          headers:
            Cache-Control:
              schema:
                type: string
                example: "private, max-age=30, stale-while-revalidate=60"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags: [Admin]
      summary: Atualizar configurações da plataforma
      description: |
        Atualiza as configurações globais do sistema.
        Apenas campos enviados no body são atualizados (merge parcial).
        Invalida o cache de `system-settings` via `revalidateTag`.
        Requer role ADMIN.
      operationId: adminUpdateSettings
      security:
        - BearerAuth: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Campos parciais — apenas envie os que deseja alterar
              properties:
                moduleAthleteEnabled:
                  type: boolean
                moduleCoachEnabled:
                  type: boolean
                modulePartnerB2BEnabled:
                  type: boolean
                moduleAffiliateEnabled:
                  type: boolean
                autoApprovePartners:
                  type: boolean
                autoApproveTierChange:
                  type: boolean
                defaultCommissionRate:
                  type: number
                  format: float
                  minimum: 0
                  maximum: 1
                  description: Taxa de comissão padrão (0.0 a 1.0)
                allowMultipleTrainersPerSport:
                  type: boolean
                enableVideoHoverPreview:
                  type: boolean
                videoHoverType:
                  type: string
                  enum: [TEASER, FULL, THUMBNAIL]
                enableB2BTestMode:
                  type: boolean
                storageProvider:
                  type: string
                  enum: [r2, cloudinary]
                aiProvider:
                  type: string
                  enum: [groq, gemini]
                geminiModel:
                  type: string
                enableCreditSystem:
                  type: boolean
                creditCostPlanGen:
                  type: integer
                  minimum: 0
                  maximum: 10000
                creditCostAiVideo:
                  type: integer
                  minimum: 0
                  maximum: 10000
                uiTheme:
                  type: string
                  enum: [light, dark-blue]
            example:
              moduleAffiliateEnabled: true
              aiProvider: "groq"
              defaultCommissionRate: 0.15
      responses:
        '200':
          description: Configurações atualizadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemSettings'
        '401':
          description: Não autorizado (requer ADMIN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

# ─── Shared Responses ─────────────────────────────────────────────────────────
  responses:
    Unauthorized:
      description: Não autenticado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Unauthorized"

    Forbidden:
      description: Sem permissão
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Forbidden"

    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Not found"

    BadRequest:
      description: Dados inválidos na requisição
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "title e scheduledAt são obrigatórios"
